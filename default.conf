map $query_string $disposition_type {
    ~*view=true    "inline";        
    default        "attachment";    
}

map $query_string $final_disposition {
    ""             "inline";           
    default        $disposition_type;  
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location /files/ {
        alias  /usr/share/nginx/html/files/; 
        autoindex on;               
        autoindex_exact_size off;   
        autoindex_localtime on;     
        charset utf-8;              
        add_header Content-Disposition $final_disposition;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
